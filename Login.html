<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>

function processamento()
{
    const nome = document.getElementById("nome").value.trim()
    const senha = document.getElementById("senha").value.trim()
    if (nome !== "Arthur")
    {
        alert("Nome incorreto!")
        return
    }
    if (senha !== "123")
    {
        alert("Senha incorreta!")
        return
    }
    document.getElementById("nomecadastrado").innerHTML = nome
    document.getElementById("senhacadastrada").innerHTML = senha + " Login realizado com sucesso!"
}
</script>
</head>
<body>
    <input id="nome" type="text" placeholder="Insira seu nome de usuário">
    <input id="senha" type="text" placeholder="Insira sua senha">
    <div id="nomecadastrado"></div>
    <div id="senhacadastrada"></div>
    <button id="botaocadastro" onclick="processamento()">Entrar</button>
</body>
</html>
